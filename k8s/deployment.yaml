apiVersion: apps/v1
kind: Deployment
metadata:
  name: games
  namespace: fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: games
  template:
    metadata:
      labels:
        app: games
    spec:
      containers:
        - name: games
          image: IMAGE_GAMES_AQUI
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: games-config
            - secretRef:
                name: games-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 600m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
